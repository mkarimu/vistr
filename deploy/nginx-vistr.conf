# nginx in front of the Vistr game server, for a domain such as play.example.com.
#
#   sudo cp deploy/nginx-vistr.conf /etc/nginx/sites-available/vistr
#   (replace play.example.com below with your domain)
#   sudo ln -s /etc/nginx/sites-available/vistr /etc/nginx/sites-enabled/vistr
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d play.example.com      # free HTTPS certificate (Let's Encrypt)
#
# certbot adds the HTTPS (443) part to this file by itself.
server {
    listen 80;
    server_name play.example.com;

    # Live game events (who's online, requests, the other player's moves) are a
    # long-lived stream: never buffer it, and don't cut it off after 60 seconds.
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
