<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vistr Draft</title>
<style>
:root{--a:#2f7de1;--b:#e5484d;--lt:#f3e3c3;--dk:#a9743f;--mid:#6fae7a;--mid2:#4d8f5b}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#1d2433;color:#fff;font:16px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:560px;padding:10px 14px;display:flex;align-items:center;gap:10px}
h1{font-size:18px;margin:0;flex:1}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:#3a4560;color:#fff}
.bar{width:100%;max-width:560px;display:flex;justify-content:space-between;padding:0 14px 8px;gap:8px}
.pl{flex:1;padding:8px 10px;border-radius:10px;background:#2a3348;border:3px solid transparent;font-weight:600}
.pl.on{border-color:#fff}.pl.A{color:#8bb8f5}.pl.B{color:#ff9a9d}
#msg{min-height:24px;font-size:14px;opacity:.9;padding:0 14px 6px;text-align:center}
#board{width:min(100vw - 12px,560px);aspect-ratio:8/9;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(9,1fr);border:4px solid #0d1220;border-radius:8px;overflow:hidden;margin-bottom:16px}
.sq{position:relative;display:flex;align-items:center;justify-content:center;background:var(--lt)}
.sq.dk{background:var(--dk)}
.sq.mid{background:#cfe6d0}.sq.mid.dk{background:var(--mid2)}
.sq.tgt::after{content:"";width:34%;height:34%;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.sq.tgt.cap::after{background:#ffd23f}
.die{width:80%;height:80%;border-radius:18%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35);position:relative;z-index:1;cursor:pointer}
.die.A{background:var(--a)}.die.B{background:var(--b)}
.die i{width:70%;height:70%;border-radius:50%;background:#fff;place-self:center;visibility:hidden}
.die i.p{visibility:visible}
.die.sel{outline:4px solid #fff}.die.can{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.sq.tgt{cursor:pointer}
</style></head><body>
<header><h1>Vistr Draft</h1><button id="new">New game</button></header>
<div class="bar"><div class="pl B" id="pB"></div><div class="pl A" id="pA"></div></div>
<div id="msg"></div>
<div id="board"></div>
<script src="rules.js"></script>
<script>
(function () {
  var R = DraftRules, g, sel = null, boardEl = document.getElementById('board');
  var PIPS = [0, 2, 4, 6, 8]; // five-pip face
  function name(p) { return p === 'A' ? 'Blue' : 'Red'; }
  function start() { g = R.newGame(); sel = null; draw(); }
  function draw() {
    var moves = R.legal(g), caps = moves.some(function (m) { return m.cap; });
    var from = {}; moves.forEach(function (m) { from[m.fr + ',' + m.fc] = 1; });
    var tg = {}; if (sel) moves.forEach(function (m) { if (m.fr === sel[0] && m.fc === sel[1]) tg[m.tr + ',' + m.tc] = m.cap ? 2 : 1; });
    boardEl.innerHTML = '';
    for (var r = 0; r < R.H; r++) for (var c = 0; c < R.W; c++) {
      var s = document.createElement('div'), k = r + ',' + c;
      s.className = 'sq' + (R.dark(r, c) ? ' dk' : '') + (r > 2 && r < 6 ? ' mid' : '') + (tg[k] ? ' tgt' + (tg[k] === 2 ? ' cap' : '') : '');
      if (g.b[r][c]) {
        var d = document.createElement('div'); d.className = 'die ' + g.b[r][c] + (sel && sel[0] === r && sel[1] === c ? ' sel' : '') + (g.b[r][c] === g.turn && from[k] && !g.winner ? ' can' : '');
        for (var i = 0; i < 9; i++) { var p = document.createElement('i'); if (PIPS.indexOf(i) >= 0) p.className = 'p'; d.appendChild(p); }
        s.appendChild(d);
      }
      s.onclick = (function (r, c) { return function () { click(r, c); }; })(r, c);
      boardEl.appendChild(s);
    }
    document.getElementById('pA').textContent = 'Blue: ' + R.count(g, 'A'); document.getElementById('pB').textContent = 'Red: ' + R.count(g, 'B');
    document.getElementById('pA').classList.toggle('on', g.turn === 'A' && !g.winner); document.getElementById('pB').classList.toggle('on', g.turn === 'B' && !g.winner);
    document.getElementById('msg').textContent = g.winner ? name(g.winner) + ' wins!' : name(g.turn) + ' to move' + (g.chain ? ' - keep jumping!' : caps ? ' - you must capture' : '');
  }
  function click(r, c) {
    if (g.winner) return;
    var moves = R.legal(g);
    if (sel) {
      var n = R.play(g, sel[0], sel[1], r, c);
      if (n) { g = n; sel = g.chain ? g.chain.slice() : null; draw(); return; }
    }
    sel = (g.b[r][c] === g.turn && moves.some(function (m) { return m.fr === r && m.fc === c; })) ? [r, c] : (g.chain ? g.chain.slice() : null);
    draw();
  }
  document.getElementById('new').onclick = start;
  start();
})();
</script></body></html>
