<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vistr reviews</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="page-bar"><a href="./" class="page-brand">Vistr</a><a href="./">Play</a></header>
<main class="page">
  <h1>Reviews</h1>
  <div class="reviews" data-reviews>
    <p class="meta">Loading reviews…</p>
  </div>
</main>
<script>
  // On the website. In the app, the menu shows this page with a form to write your own review.
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
  fetch('/api/reviews').then(r => r.json()).then(d => {
    document.querySelector('[data-reviews]').innerHTML = `
      <div class="rv-summary"><b>${d.count ? d.average.toFixed(1) : '–'}</b><span class="rv-stars">${stars(Math.round(d.average))}</span>
        <span class="meta">${d.count} review${d.count === 1 ? '' : 's'}</span></div>
      <p class="meta">Write your own review in the Vistr app: menu ☰ → Reviews (you need to be online).</p>
      <ul class="rv-list">${d.reviews.map(r => `<li><span class="rv-stars">${stars(r.stars)}</span> <b>Player ${esc(r.playerCode)}</b>
        <small>${new Date(r.updatedAt).toLocaleDateString()}</small>${r.text ? `<p>${esc(r.text)}</p>` : ''}</li>`).join('') || '<li class="meta">No reviews yet. Be the first!</li>'}</ul>`;
  }).catch(() => { document.querySelector('[data-reviews]').innerHTML = '<p>Reviews could not be loaded. Try again later.</p>'; });
</script>
</body>
</html>
