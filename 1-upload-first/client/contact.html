<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Vistr</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="page-bar"><a href="./" class="page-brand">Vistr</a><a href="./">Play</a></header>
<main class="page">
  <h1>Contact us</h1>
  <p class="meta">Questions, problems, ideas or account deletion: send us a message and we'll reply by email.</p>

  <form class="contact-form" data-contact novalidate>
    <label>Your email <small>(so we can reply)</small>
      <input type="email" name="email" required autocomplete="email" maxlength="200" placeholder="you@example.com">
    </label>
    <label>Your name <small>(optional)</small>
      <input type="text" name="name" autocomplete="name" maxlength="80">
    </label>
    <label>Topic
      <select name="topic">
        <option>Question</option>
        <option>Problem or bug</option>
        <option>Idea</option>
        <option>Delete my account</option>
        <option>Advertising</option>
        <option>Other</option>
      </select>
    </label>
    <label>Message
      <textarea name="message" rows="6" required maxlength="4000" placeholder="How can we help?"></textarea>
    </label>
    <!-- Left empty by people; spam bots fill it in -->
    <label class="trap" aria-hidden="true">Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    <p class="form-status" data-status role="status"></p>
    <button type="submit" class="send">Send message</button>
    <p class="meta">To delete your account, send from the email you signed up with and include your Player ID. We use what you send only to answer you (see <a href="privacy.html">Privacy &amp; policies</a>).</p>
  </form>
</main>
<script>
  // On the website (in the app, the app handles the form itself).
  document.querySelector('[data-contact]').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, status = f.querySelector('[data-status]'), btn = f.querySelector('.send');
    const data = Object.fromEntries(new FormData(f)); data.app = 'website';
    status.textContent = 'Sending…'; status.className = 'form-status'; btn.disabled = true;
    try {
      const r = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || 'Could not send. Try again.');
      f.reset(); status.textContent = 'Thanks! Your message is on its way. We reply by email.'; status.className = 'form-status ok';
    } catch (err) { status.textContent = err.message; status.className = 'form-status bad'; }
    btn.disabled = false;
  });
</script>
</body>
</html>
